---
# ServiceAccount + RBAC for server-side multi-tenant scoping (rbac.go).
# The proxy derives each caller's authorized-namespace set from Kubernetes RBAC
# via SubjectAccessReview, so it needs to create SARs and enumerate namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krateo-sse-proxy
  namespace: krateo-system
  labels:
    app.kubernetes.io/name: krateo-sse-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krateo-sse-proxy
  labels:
    app.kubernetes.io/name: krateo-sse-proxy
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krateo-sse-proxy
  labels:
    app.kubernetes.io/name: krateo-sse-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krateo-sse-proxy
subjects:
  - kind: ServiceAccount
    name: krateo-sse-proxy
    namespace: krateo-system
---
# Deployment for the Krateo SSE proxy.
# Polls ClickHouse every 3 s and pushes new K8s events to connected browsers
# via Server-Sent Events at /notifications/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krateo-sse-proxy
  namespace: krateo-system
  labels:
    app.kubernetes.io/name: krateo-sse-proxy
    app.kubernetes.io/component: sse-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: krateo-sse-proxy
  template:
    metadata:
      labels:
        app: krateo-sse-proxy
        app.kubernetes.io/name: krateo-sse-proxy
    spec:
      serviceAccountName: krateo-sse-proxy
      containers:
        - name: sse-proxy
          # Built and pushed by .github/workflows/sse-proxy.yaml
          image: ghcr.io/braghettos/krateo-sse-proxy:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLICKHOUSE_URL
              value: "http://krateo-clickstack-clickhouse-clickhouse-headless.clickhouse-system.svc:8123"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
                  optional: true
            - name: LISTEN_ADDR
              value: ":8080"
            # JWT validation (shared HS256 secret with authn/snowplow) —
            # REQUIRED when RBAC scoping is on (identity comes from the
            # verified token; the proxy refuses to start scoped-but-unauthenticated).
            - name: JWT_SIGN_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-sign-key
                  key: JWT_SIGN_KEY
            # Server-side multi-tenant scoping: filter events by the caller's
            # RBAC-authorized namespaces (SubjectAccessReview-derived, fail-closed).
            - name: RBAC_SCOPING_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: krateo-sse-proxy
  namespace: krateo-system
  labels:
    app.kubernetes.io/name: krateo-sse-proxy
spec:
  selector:
    app: krateo-sse-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
